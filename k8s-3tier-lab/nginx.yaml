# YAML configuration for the nginx deployment. This deployment will exist in the test-lab namespace
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  namespace: test-lab

spec:
  replicas: 1

  selector: 
    matchLabels:
      app: nginx
  
  template:
    metadata:
      labels:
        app: nginx

    spec: 
      containers:
      - name: nginx
        image: nginx

        ports:
        - containerPort: 80